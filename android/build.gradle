val natives by configurations.creating

dependencies {
    "coreLibraryDesugaring"("com.android.tools:desugar_jdk_libs:2.0.4")
    implementation("com.badlogicgames.gdx:gdx-backend-android:$gdxVersion")
    implementation(project(":core"))
    implementation("org.jetbrains.kotlin:kotlin-stdlib:$kotlinVersion")

    val platforms = listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
    platforms.forEach { platform ->
        natives("com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-$platform")
        natives("com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-$platform")
    }
}

tasks.register("copyAndroidNatives") {
    doFirst {
        val platforms = listOf("armeabi-v7a", "arm64-v8a", "x86", "x86_64")
        platforms.forEach { file("libs/$it").mkdirs() }

        configurations.getByName("natives").files.forEach { jar ->
            val outputDir = when {
                jar.name.contains("natives-armeabi-v7a") -> file("libs/armeabi-v7a")
                jar.name.contains("natives-arm64-v8a") -> file("libs/arm64-v8a")
                jar.name.contains("natives-x86_64") -> file("libs/x86_64")
                jar.name.contains("natives-x86") -> file("libs/x86")
                else -> null
            }

            outputDir?.let {
                copy {
                    from(zipTree(jar))
                    into(it)
                    include("*.so")
                }
            }
        }
    }
}

tasks.matching { it.name.contains("merge") && it.name.contains("JniLibFolders") }.configureEach {
    dependsOn("copyAndroidNatives")
}

tasks.register<Exec>("run") {
    val localProperties = project.file("../local.properties")
    var sdkPath = System.getenv("ANDROID_SDK_ROOT")

    if (localProperties.exists()) {
        val properties = java.util.Properties()
        localProperties.inputStream().use { properties.load(it) }
        sdkPath = properties.getProperty("sdk.dir") ?: sdkPath
    }

    val adb = "$sdkPath/platform-tools/adb"
    commandLine(adb, "shell", "am", "start", "-n", "com.mygame/com.mygame.android.AndroidLauncher")
}